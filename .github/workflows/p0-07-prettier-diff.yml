name: P0-07 Prettier Diff

on:
  pull_request:
    paths:
      - '__tests__/ci/p0-07-reader-trust.test.ts'
      - '.github/workflows/p0-07-prettier-diff.yml'

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write __tests__/ci/p0-07-reader-trust.test.ts
          git diff -- __tests__/ci/p0-07-reader-trust.test.ts
          test -z "$(git status --porcelain -- __tests__/ci/p0-07-reader-trust.test.ts)"
