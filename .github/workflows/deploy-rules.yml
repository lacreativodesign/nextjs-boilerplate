name: Deploy Firestore Rules

on:
  push:
    branches: [main, master]
    paths:
      - 'firestore.rules'
  workflow_dispatch:

# Rules are global and take effect immediately. Never let two publishes race.
concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Quality Gates workflow runs in parallel with this one, so it cannot
      # be relied on to block a bad publish. Re-run the rules guard here so a
      # dangerous ruleset fails BEFORE it reaches Firebase.
      - name: Firestore rules guard
        run: npx jest __tests__/config/firestore-rules-guard.test.ts --coverage=false

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy Firestore Rules
        run: |
          firebase deploy --only firestore:rules \
            --project la-creativo-erp \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive

      - name: Confirm deployment
        run: echo "Firestore rules deployed successfully"
