name: Deploy Firebase Security Rules

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-rules.yml'
      - '__tests__/config/firestore-rules-guard.test.ts'
      - '__tests__/config/storage-rules-guard.test.ts'
  workflow_dispatch:
    inputs:
      project_id:
        description: Firebase project ID (must match the protected environment variable)
        required: true
        type: string
      confirmation:
        description: Type DEPLOY FIREBASE RULES
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firebase-rules-production
  cancel-in-progress: false

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Firestore rules guard
        run: npx jest __tests__/config/firestore-rules-guard.test.ts --coverage=false

      - name: Storage rules guard
        run: npx jest __tests__/config/storage-rules-guard.test.ts --coverage=false

  deploy-rules:
    needs: validate-rules
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY FIREBASE RULES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firebase-production
    env:
      FIREBASE_PROJECT_ID: ${{ inputs.project_id }}
      EXPECTED_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate protected project target
        shell: bash
        run: |
          test -n "$EXPECTED_FIREBASE_PROJECT_ID"
          test "$FIREBASE_PROJECT_ID" = "$EXPECTED_FIREBASE_PROJECT_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@13.35.1

      - name: Deploy Firestore and Storage rules
        run: >-
          firebase deploy --only firestore:rules,storage:rules
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive
