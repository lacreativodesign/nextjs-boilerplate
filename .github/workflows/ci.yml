name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint || true # Don't fail on lint warnings initially

      - name: Build
        run: npm run build
        env:
          # Provide minimal env vars for build to succeed
          NEXT_PUBLIC_FIREBASE_API_KEY: "fake-for-ci"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "fake-for-ci"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "fake-for-ci"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "fake-for-ci"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "fake-for-ci"
          NEXT_PUBLIC_FIREBASE_APP_ID: "fake-for-ci"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_DEFAULT_TENANT_ID: "test"
          NEXTAUTH_SECRET: "ci-test-secret"
