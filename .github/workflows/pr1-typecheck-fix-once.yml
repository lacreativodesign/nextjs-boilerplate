name: PR1 Typecheck Fix Once

on:
  push:
    branches:
      - codex/tenant-safety-pr1-payment-activation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/tenant-safety-pr1-payment-activation
          fetch-depth: 0

      - name: Apply deterministic TypeScript fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/admin/sales/deals/update/route.ts')
          s = p.read_text()
          old = """      const paymentLabel =\n        closedWonPaymentPlan === 'fifty_fifty'\n          ? `50% deposit (${closedWonPayableNow.toFixed(2)} USD)`\n          : `${closedWonPayableNow.toFixed(2)} USD`;\n"""
          new = """      const isDepositPayment = closedWonPayableNow + 0.005 < closedWonAmountTotal;\n      const paymentLabel = isDepositPayment\n        ? `50% deposit (${closedWonPayableNow.toFixed(2)} USD)`\n        : `${closedWonPayableNow.toFixed(2)} USD`;\n"""
          if old not in s:
              raise SystemExit('Expected payment-label snippet not found; refusing broad edit.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove this temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/pr1-typecheck-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/sales/deals/update/route.ts
          git commit -m "fix(sales): derive deposit label from payable amount"
          git push origin HEAD:codex/tenant-safety-pr1-payment-activation
