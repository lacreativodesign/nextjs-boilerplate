name: PR3 Audit Fixes Once

on:
  push:
    branches:
      - codex/tenant-safety-pr3-canonical-payment-success
    paths:
      - .github/workflows/pr3-audit-fixes-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tenant-safety-pr3-canonical-payment-success
          fetch-depth: 0

      - name: Apply remaining audit fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected block not found in {path}')
              p.write_text(s.replace(old, new, 1))

          # Zapier may create draft invoices, but may never assert money success or production activation.
          replace(
              'lib/zapier/service.ts',
              "      const status = cleanString(params.input.status || 'draft').toLowerCase();\n",
              "      const status = 'draft';\n",
          )
          replace(
              'lib/zapier/service.ts',
              "        status,\n        lineItems:",
              "        status,\n        totalPaid: 0,\n        paidAmount: 0,\n        balanceDue: amountTotal,\n        paidAt: null,\n        lineItems:",
          )
          p = Path('lib/zapier/service.ts')
          s = p.read_text()
          start = s.index("    case 'create_project': {")
          end = s.index("    case 'update_invoice_status': {", start)
          s = s[:start] + "    case 'create_project': {\n      throw new Error(\n        'Zapier project creation is disabled. Production projects are activated by the canonical successful-payment flow.',\n      );\n    }\n" + s[end:]
          start = s.index("    case 'update_invoice_status': {")
          end = s.index("    case 'send_notification': {", start)
          replacement = """    case 'update_invoice_status': {
      const invoiceId = cleanString(params.input.invoiceId);
      if (!invoiceId) throw new Error('invoiceId is required.');
      const ref = adminDb.collection('invoices').doc(invoiceId);
      const snap = await ref.get();
      if (!snap.exists) throw new Error('Invoice not found.');
      const row = snap.data() || {};
      if (String(row.tenantId || '') !== params.tenantId) throw new Error('Forbidden');

      const requested = cleanString(params.input.status || 'draft').toLowerCase();
      if (requested.includes('paid') || requested.includes('partial')) {
        throw new Error(
          'Zapier cannot set paid or partially-paid invoice state. Record successful payment through Finance.',
        );
      }
      const status =
        requested === 'sent' || requested === 'overdue' || requested === 'issue'
          ? 'issued'
          : requested === 'voided'
            ? 'void'
            : requested;
      if (!new Set(['draft', 'issued', 'void']).has(status)) {
        throw new Error('Unsupported invoice status.');
      }
      await ref.set({ status, updatedAt: now }, { merge: true });
      return { id: invoiceId, status };
    }
"""
          p.write_text(s[:start] + replacement + s[end:])

          # Creating an invoice cannot manufacture successful-money aggregates.
          replace(
              'app/api/finance/invoices/create/route.ts',
              """    const clientName = parseString(client.companyName || client.name).trim();
    const totalPaid = parseNumber(body?.totalPaid, 0);
    if (totalPaid < 0 || totalPaid > totalInCurrency) {
      throw new AppError({
        message: 'Total paid must be between 0 and the invoice total.',
        code: 'VALIDATION_ERROR',
        status: 400,
      });
    }
    const status = computeInvoiceStatus({
      currentStatus: statusInput,
      totalPaid,
      totalAmount: totalInCurrency,
    });
    const balanceDue = computeBalanceDue(totalInCurrency, totalPaid);
""",
              """    const clientName = parseString(client.companyName || client.name).trim();
    const requestedTotalPaid = parseNumber(body?.totalPaid, 0);
    if (requestedTotalPaid !== 0 || statusInput === 'paid' || statusInput === 'partially_paid') {
      throw new AppError({
        message: 'Invoice creation cannot record successful payment. Create the invoice unpaid, then reconcile payment through Finance.',
        code: 'VALIDATION_ERROR',
        status: 400,
      });
    }
    const totalPaid = 0;
    const status = computeInvoiceStatus({
      currentStatus: statusInput,
      totalPaid,
      totalAmount: totalInCurrency,
    });
    const balanceDue = computeBalanceDue(totalInCurrency, totalPaid);
""",
          )

          # Never manually finalize a Stripe-owned payment record by passing its id into the manual adapter.
          replace(
              'lib/finance/manualClientPayment.ts',
              """    if (normalizePaymentStatus(payment.status) === 'refunded') {
      throw new Error('Refunded payments cannot be marked successful again.');
    }

    amount = money(Number(payment.amountUsd || 0));
""",
              """    if (normalizePaymentStatus(payment.status) === 'refunded') {
      throw new Error('Refunded payments cannot be marked successful again.');
    }
    const existingSource = String(payment.source || '').toLowerCase();
    const existingMethod = String(payment.method || '').toLowerCase();
    if (existingSource.includes('stripe') || existingMethod.includes('stripe')) {
      throw new Error('Stripe-originated payments must be reconciled from signed Stripe evidence.');
    }

    amount = money(Number(payment.amountUsd || 0));
""",
          )

          # Explicit tenant for the admin project activation caller.
          replace(
              'app/api/admin/projects/create/route.ts',
              """      activationResult = await ensureClientAccountActivation({
        clientId,
        clientData,
        createdByUid: me.uid,
      });
""",
              """      activationResult = await ensureClientAccountActivation({
        clientId,
        clientData,
        tenantId: me.tenantId,
        createdByUid: me.uid,
      });
""",
          )

          # Deterministic auto-project id closes the query-then-create race.
          replace(
              'lib/projects.ts',
              """  const projectRef = adminDb.collection('projects').doc();
  const now = admin.firestore.FieldValue.serverTimestamp();
  const stage = stageOverride || 'Inquiry';

  await projectRef.set({
""",
              """  const projectKey = String(dealId || orderId || '').replace(/[^A-Za-z0-9_-]/g, '_');
  const tenantKey = scopedTenantId.replace(/[^A-Za-z0-9_-]/g, '_');
  const projectRef = projectKey
    ? adminDb.collection('projects').doc(`auto_${tenantKey}_${projectKey}`.slice(0, 1400))
    : adminDb.collection('projects').doc();
  const now = admin.firestore.FieldValue.serverTimestamp();
  const stage = stageOverride || 'Inquiry';

  const projectPayload = {
""",
          )
          replace(
              'lib/projects.ts',
              """    updatedAt: now,
    isDeleted: false,
  });

  await logEvent({
""",
              """    updatedAt: now,
    isDeleted: false,
  };

  if (projectKey) {
    try {
      await projectRef.create(projectPayload);
    } catch (error: any) {
      const code = error?.code;
      if (code === 6 || code === 'already-exists') {
        const existing = await projectRef.get();
        if (existing.exists) return { id: projectRef.id, data: existing.data() };
      }
      throw error;
    }
  } else {
    await projectRef.set(projectPayload);
  }

  await logEvent({
""",
          )

          # Emulator-aware admin initialization for behavioral CI.
          replace(
              'lib/firebaseAdmin.ts',
              """try {
  if (!admin.apps.length && hasProject) {
    app = admin.initializeApp({
      credential: admin.credential.cert(serviceAccount),
    });
  } else if (admin.apps.length) {
""",
              """try {
  if (!admin.apps.length && process.env.FIRESTORE_EMULATOR_HOST) {
    app = admin.initializeApp({
      projectId: process.env.GCLOUD_PROJECT || 'demo-bizosto',
    });
  } else if (!admin.apps.length && hasProject) {
    app = admin.initializeApp({
      credential: admin.credential.cert(serviceAccount),
    });
  } else if (admin.apps.length) {
""",
          )

          # Add a real Firestore emulator gate before the production build.
          replace(
              '.github/workflows/test.yml',
              """      - name: Run tests under a non-UTC timezone (QUAL-02 regression guard)
        run: TZ=Asia/Karachi npm test
        env:
          TZ: Asia/Karachi

      - name: Build application
""",
              """      - name: Run tests under a non-UTC timezone (QUAL-02 regression guard)
        run: TZ=Asia/Karachi npm test
        env:
          TZ: Asia/Karachi

      - name: Payment engine Firestore emulator invariants
        run: >-
          npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-bizosto
          \"npx jest __tests__/integration/client-payment-engine.emulator.test.ts --runInBand --coverage=false\"
        env:
          GCLOUD_PROJECT: demo-bizosto

      - name: Build application
""",
          )
          PY

          npx --yes prettier@3.9.4 --write \
            lib/zapier/service.ts \
            app/api/finance/invoices/create/route.ts \
            lib/finance/manualClientPayment.ts \
            app/api/admin/projects/create/route.ts \
            lib/projects.ts \
            lib/firebaseAdmin.ts \
            .github/workflows/test.yml

      - name: Commit fixes and remove helper
        shell: bash
        run: |
          rm .github/workflows/pr3-audit-fixes-once.yml
          git config user.name lacreativodesign
          git config user.email lacreativodesign@gmail.com
          git add -A
          git commit -m "fix(finance): close audited payment activation bypasses"
          git push origin HEAD:codex/tenant-safety-pr3-canonical-payment-success
