name: E2E Smoke (per-role + golden tenant)

# Manual deployment certification suite. This workflow already exists on main,
# so it can be dispatched against a PR ref before merge. Missing credentials are
# a hard failure: skipped authenticated tests must never be launch evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}

    steps:
      - name: Verify E2E configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo "E2E_BASE_URL is required"; exit 1; }
          test -n "$E2E_DEMO_PASSWORD" || { echo "E2E_DEMO_PASSWORD is required"; exit 1; }
          case "$BASE_URL" in
            https://*) ;;
            *) echo "E2E_BASE_URL must use https://"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run golden tenant and per-role suites
        run: npx playwright test e2e/golden e2e/smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
