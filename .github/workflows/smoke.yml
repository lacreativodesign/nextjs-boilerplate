name: E2E Smoke (per-role)

# Manual-first to avoid noise. Runs the per-role smoke suite against a deployment.
# Requires repo secrets:
#   E2E_BASE_URL        deployment URL to test against (e.g. https://app.example.com)
#   E2E_DEMO_PASSWORD   shared password for the seeded demo_* accounts
# When E2E_DEMO_PASSWORD is missing the tests skip gracefully (see e2e/helpers/auth.ts).
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}
        run: npx playwright test e2e/smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
