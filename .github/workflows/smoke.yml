name: E2E Smoke (per-role)

# Manual-first to avoid noise. Runs the per-role smoke suite against a deployment.
# Requires repo secrets:
#   E2E_BASE_URL        deployment URL to test against (e.g. https://app.example.com)
#   E2E_DEMO_PASSWORDS_JSON   per-account credential map for isolated demo accounts
# When E2E_DEMO_PASSWORDS_JSON is missing tests skip safely (see e2e/helpers/auth.ts).
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_DEMO_PASSWORDS_JSON: ${{ secrets.E2E_DEMO_PASSWORDS_JSON }}
          E2E_EXPECTED_FIREBASE_PROJECT_ID: ${{ secrets.E2E_EXPECTED_FIREBASE_PROJECT_ID }}
          FIREBASE_PRODUCTION_PROJECT_ID: ${{ vars.FIREBASE_PRODUCTION_PROJECT_ID }}
          E2E_ISOLATED_ENVIRONMENT: ${{ vars.E2E_ISOLATED_ENVIRONMENT }}
        run: npx playwright test e2e/smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
