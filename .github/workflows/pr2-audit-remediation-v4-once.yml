name: PR2 Audit Remediation V4 Once

on:
  push:
    branches:
      - codex/tenant-safety-pr2-signup-activation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tenant-safety-pr2-signup-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reuse verified remediation patch and stabilize result typing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr2-audit-remediation-v3-once.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = []
          for line in workflow[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/pr2-remediate.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/pr2-remediate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/billing/apply-subscription-state.ts')
          text = p.read_text()
          old = 'const result = await adminDb.runTransaction(async (tx) => {'
          new = 'const result = await adminDb.runTransaction<ApplyResult>(async (tx) => {'
          if old not in text:
              raise SystemExit('canonical transaction declaration not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format touched files
        run: npx prettier --write lib/billing/apply-subscription-state.ts app/api/stripe/webhook/route.ts app/api/stripe/subscription-webhook/route.ts middleware.ts app/api/admin/settings/system/route.ts __tests__/lib/billing/apply-subscription-state.test.ts
      - name: Run focused behavioral tests
        run: npx jest --runInBand --coverage=false __tests__/lib/billing/apply-subscription-state.test.ts
      - name: Type check
        run: npm run typecheck
      - name: Commit remediation and remove helpers
        run: |
          rm .github/workflows/pr2-audit-remediation-v3-once.yml
          rm .github/workflows/pr2-audit-remediation-v4-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(auth): make first activation and currency lock atomic"
          git push origin HEAD:codex/tenant-safety-pr2-signup-activation
