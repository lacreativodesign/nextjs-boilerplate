name: PR2 Claude Audit Remediation Once

on:
  push:
    branches:
      - codex/tenant-safety-pr2-signup-activation

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tenant-safety-pr2-signup-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch verified audit findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Canonical billing service owns first activation atomically and refuses
          # live-subscription replacement. Subscription lifecycle events are deferred
          # while the reconciled checkout activation is still pending.
          path = 'lib/billing/apply-subscription-state.ts'
          replace_once(path,
          """export interface ApplyResult {\n  ok: boolean;\n  tenantExists: boolean;\n  derived: Record<string, unknown>;\n}\n""",
          """export interface ApplyResult {\n  ok: boolean;\n  tenantExists: boolean;\n  derived: Record<string, unknown>;\n  disposition?:\n    | 'applied'\n    | 'deferred_pending_checkout'\n    | 'subscription_conflict'\n    | 'activation_invariant_failed';\n}\n""")

          replace_once(path,
          """    const derived: Record<string, unknown> = { updatedAt: nowIso };\n    let auditWarning: string | null = null;\n\n    if (input.stripeStatus) {\n      derived.subscriptionState = mapStripeStatusToSubscriptionState(input.stripeStatus);\n      derived.billingStatus = normalizeBillingStatus(input.stripeStatus);\n    }\n\n    if (input.source === 'checkout.linked') {\n      // When Stripe reports trialing, preserve the canonical trial state established above.\n      // checkout.linked means the workspace is operationally activated; it does not mean the\n      // 14-day trial has already converted to a paid active subscription. Legacy callers that\n      // do not supply stripeStatus still fall back to active for backward compatibility.\n      if (!input.stripeStatus) {\n        derived.subscriptionState = 'active';\n        derived.billingStatus = 'active';\n      }\n      derived.status = 'active';\n    }\n""",
          """    const currentSubscriptionId = String(before.stripeSubscriptionId || '').trim();\n    const incomingSubscriptionId = String(input.stripeSubscriptionId || '').trim();\n    const currentBillingStatus = String(before.billingStatus || '').trim().toLowerCase();\n\n    // One live Stripe subscription may own a tenant at a time. Keep this invariant in the\n    // canonical transaction so parallel webhook endpoints cannot race past route-local guards.\n    if (\n      incomingSubscriptionId &&\n      currentSubscriptionId &&\n      currentSubscriptionId !== incomingSubscriptionId &&\n      currentBillingStatus !== 'canceled'\n    ) {\n      return {\n        ok: false,\n        tenantExists: true,\n        derived: {},\n        disposition: 'subscription_conflict' as const,\n      };\n    }\n\n    const pendingCheckoutActivation =\n      !before.activatedAt && String(before.activationStatus || '') === 'pending_checkout';\n\n    // Stripe can deliver customer.subscription.created/updated to the subscription endpoint\n    // before checkout.session.completed reaches the reconciled activation endpoint. Those\n    // events must not unlock a pending workspace or become the authority for first activation.\n    if (\n      pendingCheckoutActivation &&\n      (input.source === 'subscription.created' || input.source === 'subscription.updated')\n    ) {\n      return {\n        ok: true,\n        tenantExists: true,\n        derived: {},\n        disposition: 'deferred_pending_checkout' as const,\n      };\n    }\n\n    const derived: Record<string, unknown> = { updatedAt: nowIso };\n    let auditWarning: string | null = null;\n    const rawPlan = String(input.plan || '').trim();\n\n    if (input.stripeStatus) {\n      derived.subscriptionState = mapStripeStatusToSubscriptionState(input.stripeStatus);\n      derived.billingStatus = normalizeBillingStatus(input.stripeStatus);\n    }\n\n    if (input.source === 'checkout.linked') {\n      // First activation is claimed inside the same transaction as billing state. It is keyed\n      // by the immutable activatedAt marker plus the signup-owned activationStatus, not by\n      // subscriptionState (which parallel Stripe lifecycle events are allowed to change later).\n      if (pendingCheckoutActivation) {\n        const provisionedPlan = String(before.plan || '').trim();\n        const settings = (before.settings || {}) as Record<string, unknown>;\n        const currency = String(settings.currency || '').trim().toUpperCase();\n        if (!currency || (rawPlan && provisionedPlan !== rawPlan)) {\n          return {\n            ok: false,\n            tenantExists: true,\n            derived: {},\n            disposition: 'activation_invariant_failed' as const,\n          };\n        }\n        derived.activatedAt = nowIso;\n        derived.currencyLockedAt = nowIso;\n        derived.currencyLockedBy = 'stripe_checkout';\n      }\n\n      derived.activationStatus = 'active';\n      derived.lastBillingActivationAt = nowIso;\n      // When Stripe reports trialing, preserve the canonical trial state established above.\n      // checkout.linked means the workspace is operationally activated; it does not mean the\n      // 14-day trial has already converted to a paid active subscription. Legacy callers that\n      // do not supply stripeStatus still fall back to active for backward compatibility.\n      if (!input.stripeStatus) {\n        derived.subscriptionState = 'active';\n        derived.billingStatus = 'active';\n      }\n      derived.status = 'active';\n    }\n""")

          replace_once(path,
          """    const rawPlan = String(input.plan || '').trim();\n    if (input.source !== 'subscription.deleted' && rawPlan) {\n""",
          """    if (input.source !== 'subscription.deleted' && rawPlan) {\n""")

          replace_once(path,
          """    return { ok: true, tenantExists: true, derived };\n  });\n""",
          """    return { ok: true, tenantExists: true, derived, disposition: 'applied' as const };\n  });\n""")

          replace_once(path,
          """  if (result.ok) {\n    const actor = resolveActor(input.actor, input.source);\n    await AuditLogger.log({\n      tenantId,\n      userId: actor.userId,\n      userEmail: actor.userEmail,\n      userName: actor.userName,\n      action: input.source === 'subscription.deleted' ? 'delete' : 'update',\n      resource: 'subscription',\n      resourceId: tenantId,\n      changes: [\n        { field: 'source', oldValue: null, newValue: input.source },\n        { field: 'plan', oldValue: beforePlan, newValue: result.derived.plan ?? beforePlan },\n        {\n          field: 'subscriptionState',\n          oldValue: beforeState,\n          newValue: result.derived.subscriptionState ?? beforeState,\n        },\n      ],\n      status: 'success',\n    });\n  }\n""",
          """  if (result.ok && result.disposition !== 'deferred_pending_checkout') {\n    const actor = resolveActor(input.actor, input.source);\n    try {\n      await AuditLogger.log({\n        tenantId,\n        userId: actor.userId,\n        userEmail: actor.userEmail,\n        userName: actor.userName,\n        action: input.source === 'subscription.deleted' ? 'delete' : 'update',\n        resource: 'subscription',\n        resourceId: tenantId,\n        changes: [\n          { field: 'source', oldValue: null, newValue: input.source },\n          { field: 'plan', oldValue: beforePlan, newValue: result.derived.plan ?? beforePlan },\n          {\n            field: 'subscriptionState',\n            oldValue: beforeState,\n            newValue: result.derived.subscriptionState ?? beforeState,\n          },\n        ],\n        status: 'success',\n      });\n    } catch (error) {\n      // The canonical state and billing_state_audit entry already committed atomically.\n      // A secondary audit sink outage must not convert a successful Stripe transition into\n      // a webhook retry that can replay operational side effects.\n      console.error('[BILLING] Failed to mirror committed transition to AuditLogger', {\n        tenantId,\n        source: input.source,\n        eventId: input.eventId || null,\n        error,\n      });\n    }\n  }\n""")

          # 2) Main checkout webhook no longer owns a second non-atomic activation write and\n          # detects first activation from activationStatus/activatedAt rather than subscriptionState.
          path = 'app/api/stripe/webhook/route.ts'
          replace_once(path,
          """  eventId,\n  lockCurrency,\n}: {\n""",
          """  eventId,\n}: {\n""")
          replace_once(path,
          """  eventId?: string;\n  lockCurrency: boolean;\n}): Promise<boolean> {\n""",
          """  eventId?: string;\n}): Promise<boolean> {\n""")
          replace_once(path,
          """  if (!result.ok || !result.tenantExists) return false;\n\n  // Activation metadata is deliberately written only after the canonical billing transition\n  // succeeds. Currency becomes immutable on the first successful checkout activation.\n  const activationPayload: Record<string, unknown> = {\n    activationStatus: 'active',\n    lastBillingActivationAt: admin.firestore.FieldValue.serverTimestamp(),\n    updatedAt: admin.firestore.FieldValue.serverTimestamp(),\n  };\n  if (lockCurrency) {\n    // First activation only: preserve the original activation timestamp forever.\n    activationPayload.activatedAt = admin.firestore.FieldValue.serverTimestamp();\n    activationPayload.currencyLockedAt = admin.firestore.FieldValue.serverTimestamp();\n    activationPayload.currencyLockedBy = 'stripe_checkout';\n  }\n  await adminDb.collection('tenants').doc(tenantId).set(activationPayload, { merge: true });\n\n  return true;\n""",
          """  return Boolean(result.ok && result.tenantExists);\n""")
          replace_once(path,
          """      const tenantData = tenantSnap.data() || {};\n      const isInitialCheckout = String(tenantData.subscriptionState || '') === 'pending_checkout';\n      if (isInitialCheckout) {\n""",
          """      const tenantData = tenantSnap.data() || {};\n      const isInitialCheckout =\n        !tenantData.activatedAt && String(tenantData.activationStatus || '') === 'pending_checkout';\n      if (isInitialCheckout) {\n""")
          replace_once(path,
          """        subscription,\n        eventId: event.id,\n        lockCurrency: isInitialCheckout,\n      });\n""",
          """        subscription,\n        eventId: event.id,\n      });\n""")

          # 3) Parallel subscription endpoint respects canonical deferral/conflict decisions.
          path = 'app/api/stripe/subscription-webhook/route.ts'
          replace_once(path,
          """        await applySubscriptionState({\n          tenantId,\n          source:\n            event.type === 'customer.subscription.created'\n              ? 'subscription.created'\n              : 'subscription.updated',\n          eventId: event.id,\n          plan: updatedPlan,\n          stripeStatus: subscription.status,\n          stripeSubscriptionId: subscription.id,\n          currentPeriodEnd: subscription.current_period_end ?? null,\n          cancelAtPeriodEnd: Boolean(subscription.cancel_at_period_end),\n          trialEnd: subscription.trial_end ?? null,\n        });\n\n        if (updatedPlan) {\n""",
          """        const transition = await applySubscriptionState({\n          tenantId,\n          source:\n            event.type === 'customer.subscription.created'\n              ? 'subscription.created'\n              : 'subscription.updated',\n          eventId: event.id,\n          plan: updatedPlan,\n          stripeStatus: subscription.status,\n          stripeSubscriptionId: subscription.id,\n          currentPeriodEnd: subscription.current_period_end ?? null,\n          cancelAtPeriodEnd: Boolean(subscription.cancel_at_period_end),\n          trialEnd: subscription.trial_end ?? null,\n        });\n\n        if (transition.disposition === 'deferred_pending_checkout') {\n          // Expected cross-endpoint ordering: checkout.session.completed remains the sole\n          // authority for first activation and will retrieve the current subscription itself.\n          break;\n        }\n\n        if (!transition.ok) {\n          await deadLetterWebhookEvent(\n            event,\n            transition.disposition === 'subscription_conflict'\n              ? 'refusing to replace a different live tenant subscription'\n              : 'subscription transition failed canonical billing validation',\n          );\n          deadLettered = true;\n          break;\n        }\n\n        if (updatedPlan) {\n""")

          # 4) Currency correction remains available before activation, but the lock check and\n          # currency mutation are one Firestore transaction. The exact system-settings API is\n          # allowed through subscription lock; its own requireAdmin/canEditSection controls remain.
          path = 'middleware.ts'
          replace_once(path,
          """    pathname === '/api/billing/invoices';\n""",
          """    pathname === '/api/billing/invoices' ||\n    pathname === '/api/admin/settings/system';\n""")

          path = 'app/api/admin/settings/system/route.ts'
          replace_once(path,
          """    const tenantRef = adminDb.collection('tenants').doc(auth.user.tenantId);\n    const tenantSnap = await tenantRef.get();\n    if (!tenantSnap.exists) {\n      return NextResponse.json({ ok: false, error: 'Tenant not found' }, { status: 404 });\n    }\n\n    const tenantData = tenantSnap.data() || {};\n    const currentCurrency = normalizeCurrency(tenantData.settings?.currency) || 'USD';\n    const requestedCurrency = normalizeCurrency(body?.currency ?? body?.revenueCurrency);\n    const currencyLocked = Boolean(tenantData.currencyLockedAt);\n\n    if (requestedCurrency && !SUPPORTED_CURRENCIES.has(requestedCurrency)) {\n      return NextResponse.json(\n        { ok: false, error: 'Unsupported workspace currency.', code: 'invalid_currency' },\n        { status: 400 },\n      );\n    }\n\n    if (currencyLocked && requestedCurrency && requestedCurrency !== currentCurrency) {\n      return NextResponse.json(\n        {\n          ok: false,\n          error:\n            'Workspace currency is locked after activation because all financial records share one base currency.',\n          code: 'currency_locked',\n          currency: currentCurrency,\n        },\n        { status: 409 },\n      );\n    }\n\n    // Before first Stripe activation the founder may still correct the setup currency.\n    // Once currencyLockedAt exists this branch is unreachable for a changed currency.\n    if (!currencyLocked && requestedCurrency && requestedCurrency !== currentCurrency) {\n      await tenantRef.update({\n        'settings.currency': requestedCurrency,\n        updatedAt: serverTimestamp(),\n      });\n    }\n""",
          """    const tenantRef = adminDb.collection('tenants').doc(auth.user.tenantId);\n    const requestedCurrency = normalizeCurrency(body?.currency ?? body?.revenueCurrency);\n\n    if (requestedCurrency && !SUPPORTED_CURRENCIES.has(requestedCurrency)) {\n      return NextResponse.json(\n        { ok: false, error: 'Unsupported workspace currency.', code: 'invalid_currency' },\n        { status: 400 },\n      );\n    }\n\n    const currencyDecision = await adminDb.runTransaction(async (tx) => {\n      const tenantSnap = await tx.get(tenantRef);\n      if (!tenantSnap.exists) {\n        return { ok: false as const, status: 404 as const, code: 'tenant_not_found' as const };\n      }\n\n      const tenantData = tenantSnap.data() || {};\n      const currentCurrency = normalizeCurrency(tenantData.settings?.currency) || 'USD';\n      const currencyLocked = Boolean(tenantData.currencyLockedAt);\n\n      if (currencyLocked && requestedCurrency && requestedCurrency !== currentCurrency) {\n        return {\n          ok: false as const,\n          status: 409 as const,\n          code: 'currency_locked' as const,\n          currentCurrency,\n          currencyLocked,\n        };\n      }\n\n      const currencyChanged =\n        !currencyLocked && Boolean(requestedCurrency) && requestedCurrency !== currentCurrency;\n      if (currencyChanged) {\n        tx.update(tenantRef, {\n          'settings.currency': requestedCurrency,\n          updatedAt: serverTimestamp(),\n        });\n      }\n\n      return {\n        ok: true as const,\n        currentCurrency,\n        effectiveCurrency: requestedCurrency || currentCurrency,\n        currencyLocked,\n        currencyChanged,\n      };\n    });\n\n    if (!currencyDecision.ok) {\n      if (currencyDecision.code === 'tenant_not_found') {\n        return NextResponse.json({ ok: false, error: 'Tenant not found' }, { status: 404 });\n      }\n      return NextResponse.json(\n        {\n          ok: false,\n          error:\n            'Workspace currency is locked after activation because all financial records share one base currency.',\n          code: 'currency_locked',\n          currency: currencyDecision.currentCurrency,\n        },\n        { status: 409 },\n      );\n    }\n\n    const currentCurrency = currencyDecision.currentCurrency;\n    const currencyLocked = currencyDecision.currencyLocked;\n""")
          replace_once(path,
          """      summary:\n        !currencyLocked && requestedCurrency && requestedCurrency !== currentCurrency\n          ? `System settings updated; base currency changed from ${currentCurrency} to ${requestedCurrency} before activation.`\n          : 'System settings updated.',\n""",
          """      summary: currencyDecision.currencyChanged\n        ? `System settings updated; base currency changed from ${currentCurrency} to ${currencyDecision.effectiveCurrency} before activation.`\n        : 'System settings updated.',\n""")
          replace_once(path,
          """      currency: requestedCurrency || currentCurrency,\n""",
          """      currency: currencyDecision.effectiveCurrency,\n""")

          # 5) Behavioral regression: reproduce Claude's race exactly — subscription lifecycle\n          # arrives first, must stay pending, then reconciled checkout atomically stamps activation.
          path = '__tests__/lib/billing/apply-subscription-state.test.ts'
          replace_once(path,
          """        failedPaymentCount: 0,\n""",
          """        failedPaymentCount: 0,\n        settings: { currency: 'USD' },\n""")
          marker = """  it('returns tenantExists=false and writes nothing for a missing tenant', async () => {\n"""
          test = """  it('defers a parallel subscription event until reconciled checkout atomically claims first activation', async () => {\n    await db.collection('tenants').doc('tenant_a').set(\n      {\n        plan: 'pro',\n        subscriptionState: 'pending_checkout',\n        activationStatus: 'pending_checkout',\n        activatedAt: null,\n        currencyLockedAt: null,\n        stripeSubscriptionId: null,\n      },\n      { merge: true },\n    );\n\n    const early = await applySubscriptionState({\n      tenantId: 'tenant_a',\n      source: 'subscription.updated',\n      eventId: 'evt_subscription_first',\n      plan: 'pro',\n      stripeStatus: 'trialing',\n      stripeSubscriptionId: 'sub_race',\n      trialEnd: 1798761600,\n    });\n\n    expect(early.disposition).toBe('deferred_pending_checkout');\n    let t = await tenant();\n    expect(t.subscriptionState).toBe('pending_checkout');\n    expect(t.stripeSubscriptionId).toBeNull();\n    expect(t.activatedAt).toBeNull();\n\n    const linked = await applySubscriptionState({\n      tenantId: 'tenant_a',\n      source: 'checkout.linked',\n      eventId: 'evt_checkout_after_subscription',\n      plan: 'pro',\n      stripeStatus: 'trialing',\n      stripeCustomerId: 'cus_race',\n      stripeSubscriptionId: 'sub_race',\n      billingCycle: 'monthly',\n      trialEnd: 1798761600,\n    });\n\n    expect(linked.disposition).toBe('applied');\n    t = await tenant();\n    expect(t.subscriptionState).toBe('trial');\n    expect(t.activationStatus).toBe('active');\n    expect(t.activatedAt).toBeTruthy();\n    expect(t.currencyLockedAt).toBeTruthy();\n    expect(t.currencyLockedBy).toBe('stripe_checkout');\n    expect(t.stripeSubscriptionId).toBe('sub_race');\n\n    const originalActivatedAt = t.activatedAt;\n    await applySubscriptionState({\n      tenantId: 'tenant_a',\n      source: 'checkout.linked',\n      eventId: 'evt_checkout_replay_new_event',\n      plan: 'pro',\n      stripeStatus: 'trialing',\n      stripeCustomerId: 'cus_race',\n      stripeSubscriptionId: 'sub_race',\n      billingCycle: 'monthly',\n    });\n    t = await tenant();\n    expect(t.activatedAt).toBe(originalActivatedAt);\n  });\n\n  it('refuses to replace a different live Stripe subscription in the canonical transaction', async () => {\n    await db.collection('tenants').doc('tenant_a').set(\n      { stripeSubscriptionId: 'sub_live', billingStatus: 'active' },\n      { merge: true },\n    );\n\n    const result = await applySubscriptionState({\n      tenantId: 'tenant_a',\n      source: 'subscription.updated',\n      eventId: 'evt_conflict',\n      plan: 'pro',\n      stripeStatus: 'active',\n      stripeSubscriptionId: 'sub_other',\n    });\n\n    expect(result.ok).toBe(false);\n    expect(result.disposition).toBe('subscription_conflict');\n    expect((await tenant()).stripeSubscriptionId).toBe('sub_live');\n  });\n\n"""
          p = Path(path)
          text = p.read_text()
          if marker not in text:
              raise SystemExit(f'test marker missing in {path}')
          p.write_text(text.replace(marker, test + marker, 1))

          # Strengthen PR2 source-contract assertions for the remediated invariants.
          path = '__tests__/api/tenant-safety-pr2-signup-activation.test.ts'
          p = Path(path)
          text = p.read_text()
          anchor = """  it('keeps billing recovery available without bypassing checkout authorization', () => {\n"""
          addition = """  it('claims first activation atomically and prevents the parallel subscription webhook from unlocking pending checkout', () => {\n    const service = read('lib/billing/apply-subscription-state.ts');\n    const checkoutWebhook = read('app/api/stripe/webhook/route.ts');\n    const subscriptionWebhook = read('app/api/stripe/subscription-webhook/route.ts');\n\n    expect(service).toContain("disposition: 'deferred_pending_checkout'");\n    expect(service).toContain("derived.currencyLockedAt = nowIso");\n    expect(service).toContain("derived.activatedAt = nowIso");\n    expect(service).toContain("disposition: 'subscription_conflict'");\n    expect(checkoutWebhook).toContain("String(tenantData.activationStatus || '') === 'pending_checkout'");\n    expect(subscriptionWebhook).toContain("transition.disposition === 'deferred_pending_checkout'");\n  });\n\n  it('makes pre-activation currency correction reachable and transactional', () => {\n    const middleware = read('middleware.ts');\n    const systemSettings = read('app/api/admin/settings/system/route.ts');\n\n    expect(middleware).toContain("pathname === '/api/admin/settings/system'");\n    expect(systemSettings).toContain('adminDb.runTransaction');\n    expect(systemSettings).toContain("'settings.currency': requestedCurrency");\n  });\n\n"""
          if anchor not in text:
              raise SystemExit(f'contract test anchor missing in {path}')
          p.write_text(text.replace(anchor, addition + anchor, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format touched files
        run: npx prettier --write lib/billing/apply-subscription-state.ts app/api/stripe/webhook/route.ts app/api/stripe/subscription-webhook/route.ts middleware.ts app/api/admin/settings/system/route.ts __tests__/lib/billing/apply-subscription-state.test.ts __tests__/api/tenant-safety-pr2-signup-activation.test.ts
      - name: Run focused tests
        run: npx jest --runInBand __tests__/lib/billing/apply-subscription-state.test.ts __tests__/api/tenant-safety-pr2-signup-activation.test.ts
      - name: Type check
        run: npm run typecheck
      - name: Commit remediation and remove helper
        run: |
          rm .github/workflows/pr2-claude-audit-remediation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/billing/apply-subscription-state.ts app/api/stripe/webhook/route.ts app/api/stripe/subscription-webhook/route.ts middleware.ts app/api/admin/settings/system/route.ts __tests__/lib/billing/apply-subscription-state.test.ts __tests__/api/tenant-safety-pr2-signup-activation.test.ts .github/workflows/pr2-claude-audit-remediation-once.yml
          git commit -m "fix(auth): make first activation and currency lock atomic"
          git push origin HEAD:codex/tenant-safety-pr2-signup-activation
