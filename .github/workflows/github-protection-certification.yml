name: Main Protection Certification

# P0-06 — re-reads the LIVE branch protection on `main` and fails if it has drifted from
# what docs/security/p0-06-main-protection.certified.json certifies.
#
# WHY THIS IS A SEPARATE WORKFLOW AND NOT A STEP IN `quality`
#
# `quality` is a required status check on `main`. A live GitHub API read inside a required
# check creates a circular lockout: the day the ruleset is actually wrong is the day you
# need to merge a pull request that fixes it, and that is precisely the day the required
# check would refuse to pass. The control would block its own repair.
#
# The dependency is also not reliable enough to gate a merge. The read is authenticated with
# the job token, but any GitHub API call can fail for reasons that have nothing to do with
# this repository — and an unauthenticated one is capped at 60 per hour PER IP on runners that
# share egress addresses. That was observed while building this: an unauthenticated read
# returned HTTP 403 "API rate limit exceeded" from a shared address. A required check must not
# be able to go red like that.
#
# So the certification is split, and both halves are real:
#
#   - OFFLINE, inside `quality`: __tests__/ci/github-main-protection-certification.test.ts
#     drives the same evaluator over the committed snapshot and proves by mutation that it
#     rejects every weakening P0-06 cares about. Deterministic, network-free, blocking.
#   - LIVE, here: the actual current ruleset, on a schedule, NOT a required check. It can
#     tell you protection has been weakened without being able to stop you fixing it.
#
# This job is therefore allowed to be the thing that wakes someone up. It is not allowed to
# be the thing that holds the door shut.
#
# CREDENTIALS
#
# None beyond the automatic, job-scoped GITHUB_TOKEN. No personal access token is stored or
# required: a long-lived `administration: read` PAT would be a worse security posture than the
# drift it detects.
#
# The token is not merely a rate-limit convenience. `bypass_actors` — the field that decides
# whether any other rule is enforceable — is served by GitHub only to callers with sufficient
# access to the ruleset, so an anonymous read can come back WITHOUT it, and absent is not
# empty. The verifier therefore refuses to certify that control from an unprivileged read
# instead of defaulting it to "none". An earlier version defaulted it, which independent
# review correctly rejected as a false green.

on:
  schedule:
    # 07:00 UTC daily — noon in Asia/Karachi, so drift introduced overnight is reported
    # before the working day rather than at the next merge.
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    # Only when the certification itself changes: re-reading GitHub on every unrelated merge
    # spends rate limit to re-prove something that cannot have changed.
    paths:
      - 'docs/security/p0-06-main-protection.certified.json'
      - 'docs/security/p0-06-erp-main-ruleset.snapshot.json'
      - 'scripts/verify-github-main-protection.mjs'
      - '.github/workflows/github-protection-certification.yml'

permissions:
  contents: read

jobs:
  main-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `npm ci`: the verifier is dependency-free on purpose, so the control that proves
      # `main` is protected cannot be broken by an unrelated dependency problem.
      # `--repo=erp` on purpose. This job's token belongs to THIS repository and cannot read a
      # private bizosto-website — GitHub answers 404 — and a cross-repository read that fails
      # must never be reported as a certification. The website verifies itself from a
      # companion workflow running inside it, under its own job token.
      #
      # The token is also what makes the bypass-actor control certifiable at all: GitHub
      # serves `bypass_actors` only to callers with sufficient access to the ruleset, so the
      # verifier treats an anonymous read as unable to certify it rather than as proof of
      # absence. Running unauthenticated here would fail the control, not skip it.
      - name: Verify live main protection (P0-06)
        run: node scripts/verify-github-main-protection.mjs --repo=erp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
