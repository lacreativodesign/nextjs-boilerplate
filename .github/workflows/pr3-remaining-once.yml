name: PR3 Remaining Fixes Once

on:
  push:
    branches:
      - codex/tenant-safety-pr3-canonical-payment-success
    paths:
      - .github/workflows/pr3-remaining-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/tenant-safety-pr3-canonical-payment-success
          fetch-depth: 0

      - name: Apply remaining fixes
        run: python3 .github/pr3_remaining.py

      - name: Format touched files
        run: npx --yes prettier@3.9.4 --write app/api/finance/invoices/create/route.ts lib/finance/manualClientPayment.ts app/api/admin/projects/create/route.ts lib/finance/paymentSchedule.ts lib/firebaseAdmin.ts __tests__/integration/client-payment-engine.emulator.test.ts

      - name: Commit application and test fixes
        run: |
          git checkout -- .github/workflows/test.yml
          rm .github/pr3_remaining.py
          git config user.name lacreativodesign
          git config user.email lacreativodesign@gmail.com
          git add -A
          git reset .github/workflows/pr3-remaining-once.yml
          git commit -m "fix(finance): complete audited payment safeguards"
          git push origin HEAD:codex/tenant-safety-pr3-canonical-payment-success
