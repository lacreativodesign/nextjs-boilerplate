name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI
        run: npm run docs:api

      - name: OpenAPI drift check (DOC-01)
        run: git diff --exit-code -- docs/api/openapi.yaml

      - name: Generate Firestore schema inventory
        run: npm run docs:schema

      - name: Firestore schema drift check (DOC-02)
        run: git diff --exit-code -- docs/database/collections.generated.md

      - name: Validate formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # `e2e/` and playwright.config.ts are outside the Next.js program, so the check
      # above cannot see them. Unchecked, a type error in the certification suite would
      # first appear thirty minutes into a deployment-backed run.
      - name: Type check the certification suite
        run: npm run typecheck:e2e

      # `scripts/` is outside the Next.js program too, and P0-02 added a TypeScript
      # certification tool there that talks to live Firebase Auth. Unchecked, a type error
      # in it would first appear part-way through a production run against real accounts.
      - name: Type check the certification tool
        run: npm run typecheck:scripts

      - name: Run tests with coverage threshold
        run: npm test

      - name: Run tests under a non-UTC timezone (QUAL-02 regression guard)
        run: TZ=Asia/Karachi npm test
        env:
          TZ: Asia/Karachi

      - name: Payment engine Firestore emulator invariants
        run: >-
          npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-bizosto
          "npx jest __tests__/integration/client-payment-engine.emulator.test.ts --runInBand --coverage=false"
        env:
          GCLOUD_PROJECT: demo-bizosto

      # Plan seat ceilings are only meaningful if they hold when two requests arrive at
      # once. The in-memory Firestore double used by the unit suites cannot model
      # transaction contention, so these invariants must run against the real emulator.
      - name: Staff seat concurrency Firestore emulator invariants
        run: >-
          npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-bizosto
          "npx jest __tests__/integration/staff-seat-concurrency.emulator.test.ts --runInBand --coverage=false"
        env:
          GCLOUD_PROJECT: demo-bizosto

      # Plan storage ceilings have the same property as seat ceilings: a read-then-write
      # gate passes two simultaneous uploads against the same remaining quota. The
      # reservation that closes it is a Firestore transaction, so it can only be proven
      # against the real emulator.
      - name: Storage quota concurrency Firestore emulator invariants
        run: >-
          npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-bizosto
          "npx jest __tests__/integration/storage-quota-concurrency.emulator.test.ts --runInBand --coverage=false"
        env:
          GCLOUD_PROJECT: demo-bizosto

      # P0-04 — Firebase Security Rules BEHAVIOURAL certification.
      #
      # __tests__/config/firestore-rules-guard.test.ts and storage-rules-guard.test.ts
      # already run in `npm test` above, but both read the rulesets as TEXT. They catch a
      # dangerous edit; they cannot answer what the ruleset DOES, and in Firebase Security
      # Rules that is not a property of any single line — every matching `allow` is OR'd,
      # and five match blocks overlap on every path in this product. So the only way to
      # know that client-files/** really refuses super_admin, or that notifications really
      # needs BOTH userId and tenantId to match, is to evaluate the real files.
      #
      # This step loads firestore.rules and storage.rules into disposable Firestore and
      # Storage emulators and runs the full authorization matrix through Firebase's own
      # rules runtime. It is blocking, has no continue-on-error, and the suites refuse to
      # skip: without an emulator the harness throws instead of reporting green
      # (__tests__/rules/helpers/emulator.ts). firebase.emulator.json is a separate,
      # emulator-only config so the production bucket in firebase.json is never named
      # here, and the project id is `demo-` prefixed, which makes firebase-tools refuse to
      # reach any real Google service. No credential is used and nothing in
      # la-creativo-erp or bizosto-staging is addressable from this job.
      #
      # firebase-tools is pinned to the same 13.35.1 as the three emulator steps above and
      # as the production rules publisher in deploy-rules.yml, so the CLI that certifies
      # the ruleset is the CLI that ships it.
      - name: Firebase Security Rules behavioral certification (P0-04)
        run: npm run test:rules

      - name: Build application
        run: npm run build
        env:
          # DS-33: `next build` exhausts the runner's ~2083MB V8 old-space and aborts
          # with exit 134. Latent for as long as the workflow was unschedulable, so it
          # had never been observed. Verified: 2048 reproduces the OOM, 4096 builds
          # clean. Nothing below this line ran until this was raised.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Bundle size check
        run: npm run bundle:check

      - name: License compliance
        run: npm run licenses:check

      - name: Dependency audit (blocks on critical)
        run: npm audit --audit-level=critical

      - name: Dependency audit report (high; non-blocking until Q3 triage)
        run: npm audit --audit-level=high
        continue-on-error: true

  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Sonar token configured
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is required for Bizosto certification."
            exit 1
          fi

      - name: Test coverage
        run: npm test

      - name: SonarQube Scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          args: -Dsonar.qualitygate.wait=true
