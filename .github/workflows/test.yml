name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI
        run: npm run docs:api

      - name: OpenAPI drift check (DOC-01)
        run: git diff --exit-code -- docs/api/openapi.yaml

      - name: Generate Firestore schema inventory
        run: npm run docs:schema

      - name: Firestore schema drift check (DOC-02)
        run: git diff --exit-code -- docs/database/collections.generated.md

      - name: Validate formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage threshold
        run: npm test

      - name: Run tests under a non-UTC timezone (QUAL-02 regression guard)
        run: TZ=Asia/Karachi npm test
        env:
          TZ: Asia/Karachi

      - name: Payment engine Firestore emulator invariants
        run: >-
          npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-bizosto
          "npx jest __tests__/integration/client-payment-engine.emulator.test.ts --runInBand --coverage=false"
        env:
          GCLOUD_PROJECT: demo-bizosto

      - name: Build application
        run: npm run build
        env:
          # DS-33: `next build` exhausts the runner's ~2083MB V8 old-space and aborts
          # with exit 134. Latent for as long as the workflow was unschedulable, so it
          # had never been observed. Verified: 2048 reproduces the OOM, 4096 builds
          # clean. Nothing below this line ran until this was raised.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Bundle size check
        run: npm run bundle:check

      - name: License compliance
        run: npm run licenses:check

      - name: Dependency audit (blocks on critical)
        run: npm audit --audit-level=critical

      - name: Dependency audit report (high; non-blocking until Q3 triage)
        run: npm audit --audit-level=high
        continue-on-error: true

  sonar:
    runs-on: ubuntu-latest
    # `secrets` is not one of the contexts GitHub allows in a job-level `if:` (only
    # github, needs, vars and inputs are), so this rejected the whole workflow at parse
    # time and NO job ran — including `quality`. The gate moves to the steps that need
    # the token, where `env` IS a valid context; the job now starts and no-ops when
    # SONAR_TOKEN is unset.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test coverage
        if: env.SONAR_TOKEN != ''
        run: npm test

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
