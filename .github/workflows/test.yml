name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI
        run: npm run docs:api

      - name: OpenAPI drift check (DOC-01)
        run: git diff --exit-code -- docs/api/openapi.yaml

      - name: Generate Firestore schema inventory
        run: npm run docs:schema

      - name: Firestore schema drift check (DOC-02)
        run: git diff --exit-code -- docs/database/collections.generated.md

      - name: Validate formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage threshold
        run: npm test

      - name: Run tests under a non-UTC timezone (QUAL-02 regression guard)
        run: TZ=Asia/Karachi npm test
        env:
          TZ: Asia/Karachi

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Bundle size check
        run: npm run bundle:check

      - name: License compliance
        run: npm run licenses:check

      - name: Dependency audit (blocks on critical)
        run: npm audit --audit-level=critical

      - name: Dependency audit report (high; non-blocking until Q3 triage)
        run: npm audit --audit-level=high
        continue-on-error: true

  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect optional Sonar configuration
        id: sonar-config
        shell: bash
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.sonar-config.outputs.enabled == 'true'
        run: npm ci

      - name: Test coverage
        if: steps.sonar-config.outputs.enabled == 'true'
        run: npm test

      - name: SonarQube Scan
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v2
