name: Seed Golden Tenant

# Rebuilds the `bizosto-demo` fixture and rotates its ten demo Auth accounts to the
# password THIS repository holds.
#
# WHY IT IS A WORKFLOW AND NOT A BUTTON
#
# The Golden Tenant gate needs the ten demo accounts to carry the same password the
# Playwright run types. That password used to live in two stores kept in step by hand —
# the deployment's server environment, which the Super Admin reset button reads, and this
# repository's `E2E_DEMO_PASSWORD`, which the browser types. Nothing checked they agreed,
# and when they drifted the gate failed all thirteen tests with "Incorrect password".
#
# Seeding from the same secret store the suite reads removes the drift rather than
# documenting it: there is now one copy of the password that decides the outcome, and it
# is the one the tests use.
#
# ─────────────────────────────────────────────────────────────────────────────
# TWO THINGS AN INDEPENDENT AUDIT CHANGED HERE
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. THE SECRETS WERE AT JOB SCOPE.
#
#    `FIREBASE_ADMIN_KEY` and `E2E_DEMO_PASSWORD` were declared in the job's `env:`, so
#    `actions/checkout`, `actions/setup-node` and `npm ci` all ran with a production
#    service account in their environment. `npm ci` alone executes install scripts from
#    hundreds of packages. Nothing exploited it; it was simply a larger blast radius than
#    the job needs. The credential now appears on the single step that seeds, and the
#    early validation above it compares NON-SECRET "is it configured" booleans instead.
#
# 2. THIS WORKFLOW BRIEFLY CARRIED P0-02 CERTIFICATION, AND NO LONGER DOES.
#
#    `certify-audit` / `certify-remediate` actions were added here because a brand-new
#    workflow cannot be dispatched against a feature ref until it exists on the default
#    branch, and P0-02 had to be provable before merge. That worked, and the evidence it
#    produced is recorded in docs/security/p0-02-demo-auth-certification.md.
#
#    They are removed now. Keeping them would leave a permanent mechanism whose whole
#    purpose is handing a Firebase Admin credential to code selected by ref, which is
#    exactly the hole the environment boundary below exists to close. Certification lives
#    in `.github/workflows/demo-auth-certification.yml` and runs from `main`.
#
# WHERE THE SECRET BOUNDARY IS
#
# `workflow_dispatch` lets anyone with write access choose the ref, and the workflow file
# that runs comes from that ref — so a guard written in this file cannot defend against a
# branch that edits this file. The boundary is the `firebase-production` GitHub
# environment named below: its secrets are not repository secrets, and its deployment
# branches are restricted to `main`, which GitHub enforces before any step runs.
#
# OWNER CONFIGURATION — MUST BE VERIFIED LIVE. See the runbook in
# docs/security/p0-02-demo-auth-certification.md, including deleting the repository-level
# copies of the Admin credentials; an environment copy alongside a repository copy closes
# nothing.
#
# SAFETY
#
# `--reset` deletes every `bizosto-demo` document in nine collections. The demo tenant
# shares its Firebase project with real tenants, so two bounds apply and both fail closed:
#
#   - the tenant is fixed to `bizosto-demo` inside lib/demo/seed.ts, not passed in;
#   - the operator must name the Firebase project, and the run aborts before touching
#     anything if the credential points at a different one.
#
# No secret value is printed: the seeder reports accounts and counts, never the password.

on:
  workflow_dispatch:
    inputs:
      firebase_project_id:
        description: 'Firebase project this seed may write to (must match the environment credential)'
        required: true
        type: string
      reset:
        description: 'Delete the bizosto-demo fixture before re-seeding it'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# One rebuild at a time. Two concurrent resets would race each other's deletes and
# re-seeds and could leave the fixture half-built.
concurrency:
  group: seed-golden-tenant
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # THE BOUNDARY. `Seed Golden Tenant` is the deliberate, by-hand PRODUCTION rebuild path
    # and keeps the production account — P0-01 split the two rebuild paths by credential and
    # that is unchanged. What is new is that the credential now comes from an environment
    # restricted to `main`, rather than from a repository secret any branch could reach.
    # OWNER CONFIGURATION — MUST BE VERIFIED LIVE.
    environment: firebase-production
    env:
      # Whether the secrets EXIST, not the secrets. `secrets` is a valid context in a
      # job-level `env:` (only a job-level `if:` rejects it — DS-33), so the run can fail in
      # seconds on a missing credential without that credential being in scope for checkout,
      # the toolchain or `npm ci`.
      ADMIN_KEY_CONFIGURED: ${{ secrets.FIREBASE_ADMIN_KEY != '' }}
      DEMO_PASSWORD_CONFIGURED: ${{ secrets.E2E_DEMO_PASSWORD != '' }}
      DEMO_FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}

    steps:
      - name: Verify seed configuration
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$ADMIN_KEY_CONFIGURED" != "true" ]; then
            echo "::error::FIREBASE_ADMIN_KEY is not present in the firebase-production"
            echo "::error::environment. Add the same service account the deployment uses."
            exit 1
          fi
          if [ "$DEMO_PASSWORD_CONFIGURED" != "true" ]; then
            echo "::error::E2E_DEMO_PASSWORD is not present in the firebase-production environment."
            exit 1
          fi
          # DEFENCE IN DEPTH, NOT THE BOUNDARY — see the header. The environment's
          # deployment-branch rule is what actually stops a feature ref; this only explains it.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::The production seed runs from main only. This dispatch selected '$REF'."
            echo "::error::The firebase-production environment restricts deployments to main, so a"
            echo "::error::feature ref cannot be granted the credential."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The ONLY step that sees a credential.
      - name: Rebuild the golden tenant
        shell: bash
        env:
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
          E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}
          RESET: ${{ inputs.reset }}
        run: |
          set -euo pipefail
          # The seeder rejects anything shorter; the length is compared, never printed.
          test "${#E2E_DEMO_PASSWORD}" -ge 16 || {
            echo "::error::E2E_DEMO_PASSWORD must be at least 16 characters"
            exit 1
          }
          if [ "$RESET" = "true" ]; then
            npx --yes tsx@4.19.2 scripts/seedDemoTenant.ts --reset
          else
            npx --yes tsx@4.19.2 scripts/seedDemoTenant.ts
          fi
