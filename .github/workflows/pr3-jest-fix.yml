name: PR3 Jest Compatibility Fix

on:
  push:
    branches:
      - codex/tenant-safety-pr3-canonical-payment-success
    paths:
      - .github/workflows/pr3-jest-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/tenant-safety-pr3-canonical-payment-success

      - name: Patch stale PR3 test contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new))

          replace(
              '__tests__/config/validation-ratchet.test.ts',
              "  'app/api/ingest/orders/route.ts',\n",
              '',
          )

          replace(
              'lib/backup/backup-registry.ts',
              "  finance_ledger: {\n    class: 'audit',\n    reason: 'Append-only money ledger — the financial source of truth.',\n  },\n",
              "  finance_ledger: {\n    class: 'audit',\n    reason: 'Append-only money ledger — the financial source of truth.',\n  },\n  unapplied_client_payments: {\n    class: 'audit',\n    reason: 'Captured Stripe client payments awaiting Finance reconciliation.',\n  },\n",
          )

          replace(
              '__tests__/api/tenant-safety-pr3-canonical-payment-success.test.ts',
              "    expect(clientPortalCheckout).toContain('calculatePlatformFee(amountCents)');\n",
              "    expect(clientPortalCheckout).toContain('amountToMinorUnits(amountUsd, currency)');\n    expect(clientPortalCheckout).toContain('calculatePlatformFee(amountMinor)');\n",
          )

          replace(
              '__tests__/api/client-payment-activation-contract.test.ts',
              "    expect(connectWebhook).toContain('tenantDoc.id !== tenantId');\n",
              "    expect(connectWebhook).toContain('tenantDoc.id !== metadataTenantId');\n",
          )

          replace(
              '__tests__/api/ingest-usage-attribution.test.ts',
              "    expect(src).toMatch(/void recordIngestUsage\\(\\{ tenantId,/);\n    expect(src).toContain('const tenantId = auth.tenantId;');\n",
              "    expect(src).toMatch(/tenantId:\\s*(?:tenantId|auth\\.tenantId)/);\n    expect(src).not.toMatch(/tenantId:\\s*(?:body\\.|req\\.headers)/);\n",
          )

          replace(
              '__tests__/api/test-utils/firestore-emulator.ts',
              "  set(ref: MockDocRef, data: FirestoreRecord, options?: { merge?: boolean }) {\n    this.writes.push(() => ref.set(data, options));\n    return this;\n  }\n\n  update(ref: MockDocRef, data: FirestoreRecord) {\n",
              "  set(ref: MockDocRef, data: FirestoreRecord, options?: { merge?: boolean }) {\n    this.writes.push(() => ref.set(data, options));\n    return this;\n  }\n\n  create(ref: MockDocRef, data: FirestoreRecord) {\n    this.writes.push(() => ref.create(data));\n    return this;\n  }\n\n  update(ref: MockDocRef, data: FirestoreRecord) {\n",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format touched files
        run: >-
          npx prettier --write
          __tests__/api/webhook-idempotency.test.ts
          __tests__/api/test-utils/firestore-emulator.ts
          __tests__/config/validation-ratchet.test.ts
          lib/backup/backup-registry.ts
          __tests__/api/tenant-safety-pr3-canonical-payment-success.test.ts
          __tests__/api/client-payment-activation-contract.test.ts
          __tests__/api/ingest-usage-attribution.test.ts

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "lacreativodesign"
          git config user.email "lacreativodesign@gmail.com"
          git add \
            __tests__/api/webhook-idempotency.test.ts \
            __tests__/api/test-utils/firestore-emulator.ts \
            __tests__/config/validation-ratchet.test.ts \
            lib/backup/backup-registry.ts \
            __tests__/api/tenant-safety-pr3-canonical-payment-success.test.ts \
            __tests__/api/client-payment-activation-contract.test.ts \
            __tests__/api/ingest-usage-attribution.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(finance): align PR3 gates with hardened payment contracts"
          git push origin HEAD:codex/tenant-safety-pr3-canonical-payment-success
